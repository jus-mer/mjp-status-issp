name: "market-justice-education-issp"
output_dir: "." # Esto es para que se compile en el rootdir
navbar:
  title: "MJP Education ISSP"
  right:
    - text: "Paper"
      href: "paper.html"
    - text: ""
      icon: fa-file-pdf
      href: "paper.pdf"
    - text: ""
      icon: fa-github fa-lg
      href: https://github.com/jus-mer/market-justice-education-issp

output:
